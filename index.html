<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>给你的关心</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #ffe6ef 0%, #e8f0ff 50%, #e6fff4 100%); }
    .card { width: 100%; max-width: 420px; min-height: 380px; padding: 34px 26px 28px; border-radius: 28px; background: rgba(255, 255, 255, 0.84); box-shadow: 0 18px 50px rgba(120, 120, 160, 0.18); backdrop-filter: blur(12px); text-align: center; display: flex; flex-direction: column; justify-content: center; cursor: pointer; user-select: none; }
    .heart { font-size: 54px; line-height: 1; margin-bottom: 24px; animation: beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    .msg { min-height: 130px; display: flex; align-items: center; justify-content: center; font-size: 24px; line-height: 1.75; color: #333; font-weight: 600; letter-spacing: 0.5px; transition: opacity 0.18s ease; opacity: 1; padding: 0 6px; white-space: pre-line; }
    .tip { margin-top: 18px; font-size: 13px; color: #999; }
    button { margin-top: 26px; border: none; outline: none; padding: 14px 22px; border-radius: 999px; font-size: 16px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #ff7aa2, #7c9cff); box-shadow: 0 10px 24px rgba(124, 156, 255, 0.28); cursor: pointer; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="heart">❤️</div>
    <div class="msg" id="msg">正在准备一句关心...</div>
    <div class="tip">点卡片或按钮，换一句关心</div>
    <button id="btn">再换一句关心</button>
  </div>
  <script>
    const messages = [
      "今天也要好好吃饭，别饿着自己。", "累了就歇一会儿，不用一直逞强。", "天气变了记得添衣服，别着凉。", "你已经做得很好了，别总否定自己。", "早点睡，手机可以明天再看。", "不开心的时候，记得还有人在关心你。", "多喝热水不是敷衍，是真的希望你舒服一点。", "慢一点也没关系，按自己的节奏来。", "今天辛苦了，给自己一个抱抱。", "别忘了笑一笑，你笑起来很好看。", "有事别一个人扛，愿意听你说的人一直都在。", "愿你今天遇到的小事，都是温柔的。", "别太焦虑，很多事都会慢慢变好的。", "记得照顾好自己的情绪，比什么都重要。", "不管今天怎样，明天依然值得期待。"
    ];
    const msgEl = document.getElementById("msg");
    const cardEl = document.getElementById("card");
    const btnEl = document.getElementById("btn");
    const rawName = new URLSearchParams(location.search).get("name") || "";
    const name = rawName.trim().slice(0, 12);
    document.title = name ? "给" + name + "的关心" : "给你的关心";
    let lastIndex = -1; let timer = null;
    function decorate(text) { return name ? name + "，" + text : text; }
    function showRandomMessage() {
      let index;
      do { index = Math.floor(Math.random() * messages.length); } while (messages.length > 1 && index === lastIndex);
      lastIndex = index; msgEl.style.opacity = 0;
      setTimeout(() => { msgEl.textContent = decorate(messages[index]); msgEl.style.opacity = 1; }, 150);
    }
    function resetTimer() { clearInterval(timer); timer = setInterval(showRandomMessage, 12000); }
    function nextMessage() { showRandomMessage(); resetTimer(); }
    btnEl.addEventListener("click", function (e) { e.stopPropagation(); nextMessage(); });
    cardEl.addEventListener("click", function (e) { if (e.target.tagName !== "BUTTON") { nextMessage(); } });
    showRandomMessage(); resetTimer();
  </script>
</body>
</html>
